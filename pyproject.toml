[project]
name = "nova-cup-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "hotpheex",email = "hotpheex@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "aws-cdk-lib (>=2.200.1,<3.0.0)",
    "constructs (>=10.4.2,<11.0.0)",
    "aws-cdk-aws-lambda-python-alpha (>=2.200.1a0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.lambda-shared.dependencies]
requests = "^2.31.0"
urllib3 = "^2.4.0"
discord-py = "^2.5.2"

[tool.poetry.group.lambda-dispatcher.dependencies]
pynacl = "^1.5.0"

[tool.poetry.group.lambda-manage.dependencies]

[tool.poetry.group.dev.dependencies]
aws-lambda-powertools = {extras = ["aws-sdk"], version = "^3.13.0"}
pytest = "^8.4.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.requires-plugins]
poetry-plugin-export = "^1.0.0"
